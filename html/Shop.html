<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura&Strand</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/Aura-Strand/css/shop.css">
    <link rel="stylesheet" href="/Aura-Strand/css/BarMenu.css">
    <link rel="stylesheet" href="/Aura-Strand/css/cart.css">
    <link rel="stylesheet" href="/css/RatingProducts.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arizonia&family=Caveat:wght@400..700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Macondo+Swash+Caps&family=Markazi+Text:wght@400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Sacramento&family=Sigmar+One&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="">

    <!-- Navigation Bar -->
    <div class="menu__bar">
        <ul class="menu__items">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">Review</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <div class="icons">
            <ul class="icon__items">
                <li class="icon-cart">
                    <a href="#"><i class="fas fa-shopping-cart">
                        <span class="icon-cart-span">0</span>
                    </i></a>
                </li>
                <li><a href="#" class="fas fa-user"></a></li>
            </ul>
        </div>
    </div>

    <!-- Product Sections -->
    <!-- Example Block Repeated for Each Category -->
    <div class="Products_countainer">
        <div class="spaces"></div>
        <div class="title"><h1></h1></div>

        <div class="product">
            <div class="product-img-wrapper">
                <img src="" class="img1">
                <div class="likes">
                    <i class="fas fa-heart like-btn">
                        <span class="icon-likes-span">0</span>
                    </i>
                </div>
            </div>
            <h4>Product Title</h4>
            <div class="product-Detiles">
            <p>€Price</p>
            <button class="addcart"><h2>Add To Cart</h2></button>
            </div>
        </div>

    </div>
    
    <!-- Shopping Cart -->
    <div class="cartTap">
        <h1>Shopping Cart</h1>
        <div class="listProducts">
            <div class="items">
                <div class="image"></div>
                <div class="name"></div>
                <div class="Total Price"></div>
                <div class="quantity">
                    <span class="minus"></span>
                    <span class="num"></span>
                    <span class="plus"></span>
                </div>
            </div>
        </div>
        <div class = "cart-total">
            <h3>Total: €<span class="cart-total-price">0</span></h3>
        </div>
        <div class="buttons">
            <button class="close">Close</button>
            <button class="Purchase">Purchase</button>
        </div>
    </div>
    <!-- JavaScript -->
    <script src="/Aura-Strand/js/Cart.js"></script>
    <script src="/js/RatingProducts.js"></script>
</body>
</html>
