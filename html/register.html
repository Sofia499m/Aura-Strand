<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="/css/logIn.css" />
  <link rel="stylesheet" href="/css/BarMenu.css" />

  <!-- fonts icon -->
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arizonia&family=Caveat:wght@400..700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Macondo+Swash+Caps&family=Markazi+Text:wght@400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Sacramento&family=Sigmar+One&family=Tangerine:wght@400;700&display=swap" rel="stylesheet" />

</head>
<body>
  <!-- Navigation Bar -->
  <div class="menu__bar">
    <ul class="menu__items">
      <li><a href="/html/Home.html">Home</a></li>
      <li><a href="/html/About.html">About</a></li>
      <li><a href="/html/Shop.html">Shop</a></li>
      <li><a href="/html/review.html">Review</a></li>
      <li><a href="/html/contact.html">Contact</a></li>
    </ul>
    <div class="icons">
      <ul class="icon__items">
        <li class="username"></li>
        <li><a href="/html/logIn.html"><i class="fas fa-user"></i></a></li>
      </ul>
    </div>
  </div>

  <!-- Register Form -->
  <div class="wrapper">
    <form onsubmit="handleRegister(event)">
      <h1>Register</h1>
      <div class="input-box">
        <input type="text" placeholder="Username" required />
        <i class="bx bxs-user"></i>
      </div>
      <div class="input-box">
        <input type="email" placeholder="Email" required />
        <i class="bx bxs-envelope"></i>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Password" required />
        <i class="bx bxs-lock-alt"></i>
      </div>
      <button type="submit" class="btn">Register</button>
      <div class="register-link">
        <p>Already have an account? <a href="/html/logIn.html">Login</a></p>
      </div>
    </form>
  </div>
  <!-- JavaScript -->
  <script src="/js/register.js"></script>
</body>
</html>
