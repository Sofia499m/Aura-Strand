
<!-- Review Section -->
<section class="review" id="review">

     <!-- Section Heading -->
    <h1 class="heading">Customer's <span>Review</span></h1>

    <!-- Container for All Review Boxes -->
    <div class="box-container">

        <!-- Single Review Box -->
        <div class="box">

            <!-- Star Ratings -->
            <div class="stars">
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
            </div>
            <p>Excellent service! I'm very satisfied with the product quality and delivery speed.</p>

            <!-- User Info Section -->
            <div class="user">

                <!-- User Profile Image -->
                <img src="https://via.placeholder.com/50" alt="Customer photo">

                 <!-- User Name and Role -->
                <div class="user_info">
                    <h3>Sarah Moore</h3>
                    <span>Happy Customer</span>
                </div>
            </div>

            <!-- Quote Icon -->
            <span class="fas fa-quote-right"></span>
        </div>
    </div>
</section>

<!--review section end-->
